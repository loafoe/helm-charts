chart-dirs:
  - charts
validate-maintainers: false
remote: origin
target-branch: main

# Note: no helm-extra-set-args here on purpose. Charts whose defaults create
# CRD-backed resources (ServiceMonitor, HTTPRoute) are installed as-is; the
# lint-test workflow installs the Prometheus Operator and Gateway API CRDs
# into kind first, so the values our users get are the values we test.
