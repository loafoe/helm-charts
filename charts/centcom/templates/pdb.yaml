{{- /*
A PDB only protects availability when there's a spare replica to fall back
on. At replicaCount 1, minAvailable >= 1 makes allowedDisruptions always 0,
which just blocks Karpenter's voluntary node eviction (until it force-
terminates) with no availability upside - so skip rendering it entirely
rather than holding a node hostage for nothing.
*/}}
{{- if and .Values.podDisruptionBudget.enabled (gt (int .Values.replicaCount) 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "centcom.fullname" . }}
  labels:
    {{- include "centcom.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "centcom.selectorLabels" . | nindent 6 }}
{{- end }}
