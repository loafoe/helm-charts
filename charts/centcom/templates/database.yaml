{{- if .Values.database.enabled }}
apiVersion: dip.io/v1alpha1
kind: Postgres
metadata:
  name: {{ include "centcom.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "centcom.labels" . | nindent 4 }}
  annotations:
    "argocd.argoproj.io/sync-wave": "-1"
spec:
{{- if .Values.database.cnpg }}
  crossplane:
    compositionSelector:
      matchLabels:
        provider: cnpg
{{- end }}

  parameters:
    identifier: {{ .Values.database.identifier | default (include "centcom.fullname" .) }}
    size: {{ .Values.database.size | default "small" }}
    {{- with .Values.database.engineVersion }}
    engineVersion: {{ . | quote }}
    {{- end }}
    databaseName: {{ .Values.database.databaseName | default "picomcp" }}
    masterUsername: {{ .Values.database.username | default "picomcp" }}
  {{- if .Values.database.allocatedStorage }}
    allocatedStorage: {{ .Values.database.allocatedStorage }}
  {{- end }}
  {{- if .Values.database.multiAz }}
    multiAz: true
  {{- end }}
  {{- if and .Values.database.cnpg .Values.database.snapshots.enabled }}
    enableSnapshots: true
    snapshotClassName: {{ .Values.database.snapshots.snapshotClassName | quote }}
  {{- end }}
  {{- /*
    storageClassName is deliberately OUTSIDE the snapshots block. It used to be
    rendered only when snapshots.enabled, which silently coupled the two: on a
    storage class without a CSI driver (node-local `local-path`) you cannot use
    volume snapshots, but disabling them then dropped storageClassName too and
    the database fell back to the cluster-default class. Prefer the explicit
    database.storageClassName; fall back to the legacy snapshots.* key.
  */}}
  {{- if .Values.database.storageClassName }}
    storageClassName: {{ .Values.database.storageClassName | quote }}
  {{- else if and .Values.database.cnpg .Values.database.snapshots.enabled }}
    storageClassName: {{ .Values.database.snapshots.storageClassName | quote }}
  {{- end }}
  {{- if and .Values.database.cnpg (and .Values.database.barmanBackup .Values.database.barmanBackup.enabled) }}
    barmanBackup:
      enabled: true
      {{- if .Values.database.barmanBackup.bucketName }}
      bucketName: {{ .Values.database.barmanBackup.bucketName | quote }}
      {{- end }}
      {{- if .Values.database.barmanBackup.bucketPrefix }}
      bucketPrefix: {{ .Values.database.barmanBackup.bucketPrefix | quote }}
      {{- end }}
      retentionDays: {{ .Values.database.barmanBackup.retentionDays | default 7 }}
      compression: {{ .Values.database.barmanBackup.compression | default "gzip" | quote }}
      {{- with .Values.database.barmanBackup.scheduleBaseBackup }}
      scheduleBaseBackup: {{ . | quote }}
      {{- end }}
      {{- with .Values.database.barmanBackup.endpointURL }}
      endpointURL: {{ . | quote }}
      {{- end }}
      {{- with .Values.database.barmanBackup.maxParallel }}
      maxParallel: {{ . }}
      {{- end }}
      {{- with .Values.database.barmanBackup.credentialsSecretRef }}
      {{- /*
        Static credentials. WITHOUT this the composition assumes AWS IRSA and
        renders iam.aws.m.upbound.io Role/Policy/RolePolicyAttachment resources,
        which a cluster with no AWS provider cannot compose - the whole claim
        fails. Any S3-compatible store (RustFS here) needs this block.
      */}}
      credentialsSecretRef:
        name: {{ .name }}
        {{- with .accessKeyIdKey }}
        accessKeyIdKey: {{ . }}
        {{- end }}
        {{- with .secretAccessKeyKey }}
        secretAccessKeyKey: {{ . }}
        {{- end }}
      {{- end }}
  {{- end }}
  {{- if and .Values.database.cnpg .Values.database.restoreFromBarman .Values.database.restoreFromBarman.enabled }}
    restore:
      method: barmanObjectStore
      {{- if .Values.database.restoreFromBarman.targetTime }}
      targetTime: {{ .Values.database.restoreFromBarman.targetTime | quote }}
      {{- end }}
  {{- else if and .Values.database.cnpg .Values.database.restoreFromVolumeSnapshot.enabled }}
    storageClassName: {{ .Values.database.restoreFromVolumeSnapshot.storageClassName | quote }}
    restore:
      method: volumeSnapshot
      sourceIdentifier: {{ .Values.database.restoreFromVolumeSnapshot.sourceIdentifier | quote }}
  {{- else if .Values.database.restoreFromSnapshot }}
    restore:
      snapshotIdentifier: {{ .Values.database.snapshotId }}
  {{- end }}
  writeConnectionSecretToRef:
    name: {{ include "centcom.fullname" . }}-postgres-connection
{{- end }}
