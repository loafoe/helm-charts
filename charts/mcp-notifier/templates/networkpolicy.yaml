{{- if .Values.networkPolicy.enabled }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "mcp-notifier.fullname" . }}
  labels:
    {{- include "mcp-notifier.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "mcp-notifier.selectorLabels" . | nindent 6 }}
  ingress:
    # Allow from within the same namespace (MCP clients, probes, debugging)
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: {{ .Release.Namespace }}
      toPorts:
        - ports:
            - port: "{{ .Values.server.port }}"
              protocol: TCP
    {{- with .Values.networkPolicy.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress:
    # Allow DNS
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Allow HTTPS to external webhook endpoints (Slack, Teams)
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
{{- end }}
