{{- range $wh := .Values.slack.webhooks }}
{{- if and $.Values.slack.enabled $wh.webhookUrl (not $wh.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mcp-notifier.inlineSecretName" (list $ "slack" $wh.name) }}
  labels:
    {{- include "mcp-notifier.labels" $ | nindent 4 }}
type: Opaque
stringData:
  webhook-url: {{ $wh.webhookUrl | quote }}
---
{{- end }}
{{- end }}
{{- range $wh := .Values.teams.webhooks }}
{{- if and $.Values.teams.enabled $wh.webhookUrl (not $wh.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mcp-notifier.inlineSecretName" (list $ "teams" $wh.name) }}
  labels:
    {{- include "mcp-notifier.labels" $ | nindent 4 }}
type: Opaque
stringData:
  webhook-url: {{ $wh.webhookUrl | quote }}
---
{{- end }}
{{- end }}
{{- range $bot := .Values.telegram.bots }}
{{- if and $.Values.telegram.enabled $bot.botToken (not $bot.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mcp-notifier.telegramInlineSecretName" (list $ $bot.name) }}
  labels:
    {{- include "mcp-notifier.labels" $ | nindent 4 }}
type: Opaque
stringData:
  bot-token: {{ $bot.botToken | quote }}
  chat-id: {{ $bot.chatId | quote }}
---
{{- end }}
{{- end }}
