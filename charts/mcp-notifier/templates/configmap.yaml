apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mcp-notifier.fullname" . }}-config
  labels:
    {{- include "mcp-notifier.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- if and .Values.slack.enabled .Values.slack.webhooks }}
    slack:
      webhooks:
        {{- range .Values.slack.webhooks }}
        {{ .name }}:
          webhook_url: {{ printf "${%s}" (include "mcp-notifier.webhookEnvVar" (list "slack" .name)) | quote }}
          {{- if .username }}
          username: {{ .username | quote }}
          {{- end }}
          {{- if .iconEmoji }}
          icon_emoji: {{ .iconEmoji | quote }}
          {{- end }}
        {{- end }}
    {{- end }}
    {{- if and .Values.teams.enabled .Values.teams.webhooks }}
    teams:
      webhooks:
        {{- range .Values.teams.webhooks }}
        {{ .name }}:
          webhook_url: {{ printf "${%s}" (include "mcp-notifier.webhookEnvVar" (list "teams" .name)) | quote }}
          {{- if .title }}
          title: {{ .title | quote }}
          {{- end }}
        {{- end }}
    {{- end }}
    {{- if and .Values.telegram.enabled .Values.telegram.bots }}
    telegram:
      bots:
        {{- range .Values.telegram.bots }}
        {{ .name }}:
          bot_token: {{ printf "${%s}" (include "mcp-notifier.telegramEnvVar" (list "BOT_TOKEN" .name)) | quote }}
          chat_id: {{ printf "${%s}" (include "mcp-notifier.telegramEnvVar" (list "CHAT_ID" .name)) | quote }}
          {{- if .apiBaseUrl }}
          api_base_url: {{ .apiBaseUrl | quote }}
          {{- end }}
        {{- end }}
    {{- end }}
