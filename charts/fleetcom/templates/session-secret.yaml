{{- $k := .Values.session.key }}
{{- if $k.value }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fleetcom.fullname" . }}-session
  labels:
    {{- include "fleetcom.labels" . | nindent 4 }}
type: Opaque
stringData:
  session-key: {{ $k.value | quote }}
{{- else if $k.generate }}
# Generated once (refreshInterval 0): the key changes only when the Secret is deleted
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ include "fleetcom.fullname" . }}-session
  labels:
    {{- include "fleetcom.labels" . | nindent 4 }}
spec:
  length: 64
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "fleetcom.fullname" . }}-session
  labels:
    {{- include "fleetcom.labels" . | nindent 4 }}
spec:
  refreshInterval: "0"
  target:
    name: {{ include "fleetcom.fullname" . }}-session
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ include "fleetcom.fullname" . }}-session
{{- end }}
