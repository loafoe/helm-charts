# Default values for go-hello-world.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Names the instance in the UI, e.g. "azure" or "emerald".
# ci: throwaway change to exercise lint-test on the new action versions
color: "colorless"

# Appended to the generated hostnames to build the in-cluster URL.
environmentConfig:
  clusterFqdn: "local"

replicaCount: 1

image:
  repository: ghcr.io/loafoe/go-hello-world
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Extra environment variables, e.g.
#   env:
#     - name: OTLP_ADDRESS
#       value: otel-collector.observability:4317
env: []

serviceMonitor:
  create: true

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podLabels: {}

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 64205
  runAsGroup: 64205
  fsGroup: 64205
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  runAsUser: 64205
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Probes hit the dedicated health endpoint rather than the dashboard.
livenessProbe:
  enabled: true
  path: /healthz
  initialDelaySeconds: 3
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

readinessProbe:
  enabled: true
  path: /healthz
  initialDelaySeconds: 3
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

# Give in-flight requests a moment to drain on SIGTERM.
terminationGracePeriodSeconds: 30

service:
  type: ClusterIP
  port: 80
  metricsPort: 9100

ingress:
  enabled: false
  className: ""
  annotations: {}
    #  nginx.ingress.kubernetes.io/backend-protocol=HTTP
    #  nginx.ingress.kubernetes.io/force-ssl-redirect=true
    #  nginx.ingress.kubernetes.io/rewrite-target=/
    #  nginx.ingress.kubernetes.io/ssl-redirect=true
  hosts:
    - host: go-hello-world.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

httpRoute:
  enabled: false
  # Name of the existing Gateway to attach to (required if enabled)
  gatewayName: ""
  # Namespace of the Gateway (optional, defaults to the same namespace as the HTTPRoute)
  gatewayNamespace: ""
  # Annotations for the HTTPRoute resource
  annotations: {}
  # Hostnames for the HTTPRoute
  hostnames:
    - "{{ include \"go-hello-world.fullname\" . }}.{{ .Values.environmentConfig.clusterFqdn }}"
  # Rules for routing
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # backendRefs are automatically configured to point to the service

resources:
  limits:
    cpu: 100m
    memory: 64Mi
  requests:
    cpu: 100m
    memory: 64Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
          - key: "kubernetes.io/arch"
            operator: In
            values: ["amd64", "arm64"]
