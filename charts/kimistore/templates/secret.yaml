{{- /*
Object-storage credentials.

Deliberately optional and deliberately minimal. The agent uses the AWS SDK's
default credential chain, which already resolves IRSA / workload identity, node
role, and mounted web-identity tokens -- the path that needs no Secret at all
and no long-lived key in the cluster.

reach set to default means prefer the chain and fall back to these keys only if
it yields nothing, so an IRSA-enabled cluster with a stale Secret does not
silently stop rotating.
*/}}
{{- if and .Values.objectStorage.accessKeyId .Values.objectStorage.secretAccessKey (not .Values.objectStorage.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kimistore.fullname" . }}-storage
  labels:
    {{- include "kimistore.labels" . | nindent 4 }}
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: {{ .Values.objectStorage.accessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.objectStorage.secretAccessKey | quote }}
  {{- with .Values.objectStorage.sessionToken }}
  AWS_SESSION_TOKEN: {{ . | quote }}
  {{- end }}
{{- end }}
{{- if and .Values.sasl.enabled (not .Values.sasl.existingSecret) .Values.sasl.username }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kimistore.fullname" . }}-sasl
  labels:
    {{- include "kimistore.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.sasl.username | quote }}
  password: {{ .Values.sasl.password | quote }}
{{- end }}