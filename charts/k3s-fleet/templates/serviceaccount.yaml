{{- range $component := list "api" "worker" }}
{{- $sa := index $.Values $component "serviceAccount" }}
{{- if $sa.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "k3s-fleet.serviceAccountName" (dict "ctx" $ "component" $component) }}
  labels:
    {{- include "k3s-fleet.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
  {{- with $sa.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The API never calls AWS or Kubernetes; only the worker's account carries an IRSA role
automountServiceAccountToken: {{ eq $component "worker" }}
{{- end }}
{{- end }}
