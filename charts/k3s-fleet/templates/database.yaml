{{- if .Values.database.cnpg.enabled }}
{{- $db := .Values.database.cnpg }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "k3s-fleet.dbCluster" . }}
  labels:
    {{- include "k3s-fleet.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
  annotations:
    # Before the Deployments, which need its <name>-app secret
    argocd.argoproj.io/sync-wave: "-1"
spec:
  instances: {{ $db.instances }}
  {{- with $db.imageCatalogRef }}
  # An image catalog (e.g. one a cluster policy enforces) instead of a fixed image
  imageCatalogRef:
    {{- toYaml . | nindent 4 }}
  {{- else }}
  imageName: {{ $db.imageName }}
  {{- end }}
  # CNPG creates the database, its owner, and the <name>-app secret with a "uri" key
  bootstrap:
    initdb:
      database: fleet
      owner: fleet
  storage:
    size: {{ $db.storage.size }}
    {{- with $db.storage.storageClass }}
    storageClass: {{ . }}
    {{- end }}
  {{- with $db.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
