name: 'Helm Chart Repo (ghcr.io)'
description: 'Turn your repo with charts into a Helm charts repo on GitHub Container Registry, ghcr.io (OCI-based). Works on private repos.'
branding:
  icon: 'anchor'
  color: 'blue'
inputs:
  chartsPath:
    description: 'The path where to find the charts. Usually either "charts/" or "./". Must end with a slash.'
    required: false
    default: './'
  token:
    description: 'GitHub Token {{ secrets.GITHUB_TOKEN }} with the privilege set to write packages.'
    required: true
runs:
  using: "composite"
  steps:

    - name: Package Helm Charts
      shell: bash
      run: |
        find "${CHARTS_PATH}" -type f -name 'Chart.yaml' | sed -r 's|/[^/]+$||' | sort | uniq | xargs --verbose -L 1 helm dep up
        for d in "${CHARTS_PATH}"*/ ; do
            if [[ ! -f "${d}Chart.yaml" ]]; then
                echo "${d}Chart.yaml not found. Skipping."
                continue
            fi
            echo "$d"
            helm package "$d" -u -d dist
        done
      env:
        CHARTS_PATH: ${{ inputs.chartsPath }}

    # Log in to the registry *host*. Helm 3 only warned when given a
    # repository path here; Helm 4 rejects it outright
    # ("invalid registry ghcr.io/loafoe/helm-charts").
    - name: Login to GitHub Container Registry (helm)
      shell: bash
      run: echo "${GITHUB_TOKEN}" | helm registry login "${REGISTRY_HOST}" --username "${GITHUB_ACTOR}" --password-stdin
      env:
        REGISTRY_HOST: "ghcr.io"
        GITHUB_TOKEN: ${{ inputs.token }}

    - name: Login to GitHub Container Registry (docker)
      shell: bash
      run: echo "${GITHUB_TOKEN}" | docker login "${REGISTRY_HOST}" --username "${GITHUB_ACTOR}" --password-stdin
      env:
        REGISTRY_HOST: "ghcr.io"
        GITHUB_TOKEN: ${{ inputs.token }}

    - name: Push Helm Charts to Github Container Registry (OCI)
      shell: bash
      working-directory: dist
      run: |
        # shellcheck disable=SC2086
        : > ../signed-refs.txt
        for f in *.tgz ; do
            # Every tag is immutable in ghcr, and this loop re-packages every chart on every
            # push, so a run that changes one chart would otherwise die on the first chart
            # whose version is already published ("failed to perform Tag ... not found") and
            # never reach the one it was supposed to ship. Skip what is there, push what is
            # new; the loop is alphabetical, so the skip keeps the rest of the run alive.
            chart_ref="oci://${REGISTRY}/$(helm show chart "$f" | awk '/^name:/{print $2}')"
            chart_version=$(helm show chart "$f" | awk '/^version:/{print $2}')
            if helm show chart "${chart_ref}" --version "${chart_version}" >/dev/null 2>&1; then
                echo "skipping $f: ${chart_ref}:${chart_version} is already published"
                continue
            fi
            echo "helm push $f oci://${REGISTRY}"
            push_output=$(helm push $f "oci://${REGISTRY}" 2>&1) || { printf '%s\n' "$push_output" >&2; exit 1; }
            printf '%s\n' "$push_output"
            # Sign by digest, not by tag: a tag is mutable, so cosign (rightly)
            # warns when asked to sign one. helm push prints the digest of
            # what it just pushed; use that instead of ":${version}".
            name=$(helm show chart "$f" | awk '/^name:/{print $2}')
            digest=$(printf '%s\n' "$push_output" | awk '/^Digest:/{print $2}')
            if [ -z "$digest" ]; then
                echo "::error::could not parse digest from helm push output for ${f}"
                exit 1
            fi
            echo "${REGISTRY}/${name}@${digest}" >> ../signed-refs.txt
        done
      env:
        # The full reference, host *and* repository path, unlike the logins above.
        REGISTRY: "ghcr.io/${{ github.repository }}"

    - name: Install cosign
      uses: sigstore/cosign-installer@v3

    - name: Sign Helm Charts
      shell: bash
      working-directory: dist
      run: |
        while read -r ref; do
          echo "cosign sign --yes $ref"
          cosign sign --yes "$ref"
        done < ../signed-refs.txt
